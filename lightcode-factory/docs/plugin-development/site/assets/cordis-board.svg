<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Cordis 智能配电板类比</title>
  <desc id="desc">Context 作为中心配电板，通过 inject 为插件连接 Tools、Storage、Agent 与 UI 服务，effect 负责安全断开。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202d54"/><stop offset="1" stop-color="#0f1730"/></linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7568ff"/><stop offset="1" stop-color="#5143c7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#080d1b" flood-opacity=".28"/></filter>
  </defs>
  <rect width="720" height="560" rx="32" fill="#f2efe6"/>
  <g opacity=".45" stroke="#d8d3c5"><path d="M0 80h720M0 160h720M0 240h720M0 320h720M0 400h720M0 480h720"/><path d="M80 0v560M160 0v560M240 0v560M320 0v560M400 0v560M480 0v560M560 0v560M640 0v560"/></g>
  <g filter="url(#shadow)">
    <rect x="175" y="75" width="370" height="410" rx="34" fill="url(#panel)" stroke="#374a78" stroke-width="3"/>
    <circle cx="210" cy="110" r="7" fill="#ff8264"/><circle cx="234" cy="110" r="7" fill="#ffc85a"/><circle cx="258" cy="110" r="7" fill="#4ed5b5"/>
    <text x="360" y="124" text-anchor="middle" fill="#f8f7ff" font-family="Arial,sans-serif" font-size="24" font-weight="700">CORDIS CONTEXT</text>
    <text x="360" y="150" text-anchor="middle" fill="#94a4ca" font-family="Arial,sans-serif" font-size="13">lifecycle-aware service board</text>
    <g transform="translate(215 182)">
      <g><rect width="120" height="78" rx="17" fill="#151f3c" stroke="#6076ae"/><circle cx="37" cy="39" r="13" fill="#7e8fb9"/><circle cx="83" cy="39" r="13" fill="#7e8fb9"/><text x="60" y="102" text-anchor="middle" fill="#b6c3e4" font-family="Arial,sans-serif" font-size="13">ctx.tools</text></g>
      <g transform="translate(170)"><rect width="120" height="78" rx="17" fill="#151f3c" stroke="#6076ae"/><circle cx="37" cy="39" r="13" fill="#7e8fb9"/><circle cx="83" cy="39" r="13" fill="#7e8fb9"/><text x="60" y="102" text-anchor="middle" fill="#b6c3e4" font-family="Arial,sans-serif" font-size="13">ctx.storage</text></g>
      <g transform="translate(0 150)"><rect width="120" height="78" rx="17" fill="#151f3c" stroke="#6076ae"/><circle cx="37" cy="39" r="13" fill="#7e8fb9"/><circle cx="83" cy="39" r="13" fill="#7e8fb9"/><text x="60" y="102" text-anchor="middle" fill="#b6c3e4" font-family="Arial,sans-serif" font-size="13">ctx.agents</text></g>
      <g transform="translate(170 150)"><rect width="120" height="78" rx="17" fill="#151f3c" stroke="#6076ae"/><circle cx="37" cy="39" r="13" fill="#7e8fb9"/><circle cx="83" cy="39" r="13" fill="#7e8fb9"/><text x="60" y="102" text-anchor="middle" fill="#b6c3e4" font-family="Arial,sans-serif" font-size="13">ctx.slots</text></g>
    </g>
  </g>
  <g transform="translate(55 176)">
    <path d="M0 58h112c28 0 40 18 40 38" fill="none" stroke="#ff8f5d" stroke-width="8" stroke-linecap="round"/>
    <rect y="18" width="94" height="82" rx="19" fill="url(#plug)" filter="url(#shadow)"/>
    <path d="M94 42h22v16H94M94 68h22v16H94" fill="#e9e8ff"/>
    <text x="47" y="49" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">PLUGIN</text>
    <text x="47" y="70" fill="#d7d4ff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">inject: tools</text>
  </g>
  <g transform="translate(568 308)">
    <path d="M97 58H-15c-28 0-40 18-40 38" fill="none" stroke="#2ac3aa" stroke-width="8" stroke-linecap="round"/>
    <rect x="3" y="18" width="94" height="82" rx="19" fill="#118b81" filter="url(#shadow)"/>
    <path d="M3 42h-22v16H3M3 68h-22v16H3" fill="#d9fff9"/>
    <text x="50" y="49" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">PLUGIN</text>
    <text x="50" y="70" fill="#c6fff5" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">effect: dispose</text>
  </g>
  <g transform="translate(70 480)"><circle r="7" fill="#ff8f5d"/><text x="17" y="5" fill="#606a7c" font-family="Arial,sans-serif" font-size="13">inject 决定何时接通</text></g>
  <g transform="translate(475 480)"><circle r="7" fill="#2ac3aa"/><text x="17" y="5" fill="#606a7c" font-family="Arial,sans-serif" font-size="13">effect 决定如何断开</text></g>
</svg>
